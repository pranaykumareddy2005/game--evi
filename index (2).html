  @keyframes shake{0%{transform:translate(0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,0)}100%{transform:translate(0)}}

      case 'ip': {
        const sub=rest[0]||'addr';
        if(sub==='addr'||sub==='a'){write('1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536\n    inet 127.0.0.1/8 scope host lo\n2: ghost0: <BROADCAST,UP,LOWER_UP> mtu 1500\n    inet 10.13.37.7/24 brd 10.13.37.255 scope global ghost0');}
        else if(sub==='link'){write('1: lo: mtu 65536 state UP\n2: ghost0: mtu 1500 state UP qdisc virtual');}
        else if(sub==='route'||sub==='r'){write('default via 10.13.37.1 dev ghost0\n10.13.37.0/24 dev ghost0 proto kernel scope link');}
        else if(sub==='-s' || sub==='stats'){beep('packet');soundLabel('PACKET COUNTERS');write('ghost0: RX  18,431 packets  1.82 MiB  errors 0  dropped 2\n         TX  15,902 packets  1.41 MiB  errors 0  dropped 0\nlo:     RX   2,140 packets  0.31 MiB  errors 0  dropped 0\n         TX   2,140 packets  0.31 MiB  errors 0  dropped 0');}
        else if(sub==='packets'){beep('packet');soundLabel('PACKET VIEW');write('PACKET VIEW // ghost0\nTIME       SRC            DST            PROTO  LEN  STATE\n22:17:01   10.13.37.7     10.13.37.1    UDP    84   RX\n22:17:02   10.13.37.1     10.13.37.7    TCP    512  TX\n22:17:03   10.13.37.9     10.13.37.7    ICMP   84   RX\n22:17:04   10.13.37.7     10.13.37.9    TCP    128  TX\n[simulation] no real packets are captured.');}
        else write('Usage: ip addr | ip link | ip route | ip -s link | ip packets','dim'); break; }
      case 'ss': write('Netid State  Local Address:Port  Peer Address:Port\ntcp   LISTEN  10.13.37.7:22      0.0.0.0:*\ntcp   ESTAB   10.13.37.7:31337   10.13.37.9:51822\nudp   UNCONN  10.13.37.7:514     0.0.0.0:*'); break;
      case 'journalctl': case 'logs': case 'dmesg': detailedLogs(); break;
      case 'permissions': case 'getfacl': case 'namei': permissionsReport(); break;
      case 'iptables': write('Chain INPUT (policy ACCEPT)\nnum  target  prot source      destination\n1    ACCEPT  all  10.13.37.0/24  0.0.0.0/0\n2    ACCEPT  tcp  0.0.0.0/0     10.13.37.7 tcp dpt:22\n[simulation] packet filtering is visual only.'); break;
      case 'neofetch':
        writeHTML(`<span class="info">      ██████  ██████</span>  ghost@blackice<br><span class="info">    ██      ██    ██</span>  ----------------<br><span class="info">  ██   ◼◼   ██    ██</span>  OS: BLACK//ICE Linux 7.13<br><span class="info">  ██        ██    ██</span>  Kernel: 5.19.13-bi<br><span class="info">    ██    ██      </span>  Shell: bash 5.2<br><span class="info">      ████████████</span>  Theme: CRT_GHOST<br>                           Terminal: blackice-tty<br>                           Node: 07 / SIMULATION`);
        break;
      case 'nano': case 'pico': openEditor(rest[0]||'scratch.txt'); break;
      case 'cmatrix': startMatrix(); break;
      case 'find': {
        const root=absPath(rest.find(x=>!x.startsWith('-'))||'.'); const pattern=(rest.find(x=>x==='-name')?rest[rest.indexOf('-name')+1]:null)||'*'; const matches=Object.keys(state.fs).filter(p=>p.startsWith(root.endsWith('/')?root:root+'/')||p===root).filter(p=>glob(pattern,p.split('/').pop()||''));write(matches.join('\n')||'','out');break;
      }
      case 'grep': {
        const file=rest[rest.length-1], needle=rest.filter(x=>x!==file&&!x.startsWith('-')).join(' ');const n=state.fs[absPath(file)];if(!n){write(`grep: ${file}: No such file or directory`,'err');break}write(n.content.split('\n').filter(l=>l.toLowerCase().includes(needle.toLowerCase())).join('\n'));break;
      }
      case 'wc': {const p=absPath(rest[rest.length-1]||'');const n=state.fs[p];if(!n||n.type!=='file'){write(`wc: ${rest[0]||''}: No such file or directory`,'err');break}write(`  ${n.content.split('\n').length-1}  ${n.content.split(/\s+/).filter(Boolean).length}  ${n.content.length} ${rest[rest.length-1]}`);break;}
      case 'which': write((commands.includes(rest[0])?`/usr/bin/${rest[0]}`:`which: no ${rest[0]} in (/usr/local/bin:/usr/bin:/bin)`));break;
      case 'whereis': write(`${rest[0]}: /usr/bin/${rest[0]} /usr/share/man/man1/${rest[0]}.1`);break;
      case 'man': write(`MANUAL PAGE — ${rest[0]||'intro'}\n\nThis simulated shell implements a safe visual subset of common Linux commands.\nTry: man ls, man grep, man find, man chmod`,'info');break;
      case 'chmod': case 'chown': write(`${cmd}: permissions updated in simulated environment`,'dim');break;
      case 'passwd': beep('success');write('Changing password for ghost.','info');write('New password: ********');write('Retype new password: ********');write('passwd: password updated successfully (simulation)','out');break;
      case 'sudo': {
        if(rest[0]==='apt' && rest[1]==='update') {
          state.pendingJob='apt'; beep('update'); write('[sudo] password for ghost: ********','warn'); write('Authentication accepted (simulation).','dim');
          const pkgs=['blackice-core','ghostwire-shell','crt-utils','matrix-tools','retro-ui'];
          pkgs.forEach((pkg,i)=>queueTimer(()=>{beep('update');write(`Get:${String(i+1).padStart(2,' ')} https://packages.blackice.invalid/ ${pkg} [simulated]`,'out')},220*i));
          queueTimer(()=>write('Fetched 0 B in 0s (0 B/s)','dim'),1100);
          queueTimer(()=>write('Reading package lists... Done','info'),1300);
          queueTimer(()=>{write('All packages are up to date.','info'); write('ghost@blackice: update complete.','dim'); finishJob();},1500);
        } else {write(`[sudo] password for ghost: ********`,'warn'); write('Authentication accepted (simulation). No privilege escalation occurs outside this browser.','dim')}
        break;
      }
      case 'apt': {
        if(rest[0]==='update') {
          state.pendingJob='apt'; beep('update'); write('Hit:1 blackice://virtual-repository stable InRelease','out');
          queueTimer(()=>{beep('update');write('Get:1 blackice-core [simulated]','out')},260);
          queueTimer(()=>{beep('update');write('Get:2 ghostwire-shell [simulated]','out')},520);
          queueTimer(()=>write('Reading package lists... Done','info'),900);
          queueTimer(()=>{write('All packages are up to date.','info'); write('ghost@blackice: update complete.','dim'); finishJob();},1200);
        } else write('apt: simulated package manager\nUsage: sudo apt update\nNo packages were changed.','dim');
        break;
      }
      case 'ping': {const host=rest[0]||'127.0.0.1';write(`PING ${host} (${host}) 56(84) bytes of data.`);setTimeout(()=>{write(`64 bytes from ${host}: icmp_seq=1 ttl=64 time=0.037 ms`);write(`64 bytes from ${host}: icmp_seq=2 ttl=64 time=0.041 ms`);},180);break;}
      case 'ssh': write('ssh: simulated connection established to the virtual network.\nNo real network traffic is generated.','info');break;
      case 'curl': case 'wget': write(`${cmd}: fetched 0 bytes — external network access is disabled in this demo.`,'dim');break;
      case 'glitch': triggerGlitch(1200); write('GLITCH//ENGINE — intensity raised.','warn'); break;
      case 'sleep': write(`sleep: ${rest[0]||'1'}s (simulated)`,'dim');break;
      case 'yes': for(let i=0;i<6;i++)write(rest.join(' ')||'y');break;
      case 'exit': write('Session retained for the demo. Use the browser to close the terminal.','warn');break;
      default:
        if(commands.includes(cmd)) write(`${cmd}: command simulated — output omitted by design`,'dim');
        else {beep('error');write(`${cmd}: command not found. Type 'help' for a command index.`,'err');triggerGlitch(260)}
    }
    if(raw && state.history[state.history.length-1]!==raw){state.history.push(raw);if(state.history.length>100)state.history.shift()} state.histIndex=state.history.length;
    if(!['clear','reset'].includes(cmd) && !state.matrix && !state.editor && !state.pendingJob)prompt(); else if(!state.matrix && !state.editor && !state.pendingJob)input.focus();
  }
  function deleteRecursive(p){const n=state.fs[p];if(!n)return;if(n.type==='dir')for(const child of [...(n.children||[])])deleteRecursive(norm(p+'/'+child));const par=p.slice(0,p.lastIndexOf('/'))||'/';if(state.fs[par]?.children)state.fs[par].children=state.fs[par].children.filter(x=>x!==p.slice(p.lastIndexOf('/')+1));delete state.fs[p]}
  function glob(pattern, name){if(pattern==='*')return true;const re=new RegExp('^'+pattern.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$');return re.test(name)}
  function triggerGlitch(ms=500){shell.classList.add('glitch','retro-hit');beep('glitch');soundLabel('SIGNAL DISTORTION');clearTimeout(state.glitchTimer);if(signalTear){signalTear.style.setProperty('--tear-top',(10+Math.random()*75).toFixed(1)+'%');signalTear.classList.add('active')}clearTimeout(state.glitchTimer);state.glitchTimer=setTimeout(()=>{shell.classList.remove('glitch','retro-hit');signalTear?.classList.remove('active')},ms)}
  function boot(skip=false){
    input.remove();
    if(!skip){
      writeHTML('<span class="boot-logo">BLACK//ICE // GHOSTWIRE TERMINAL</span>','out');
      write('[ OK ] mounting virtual root filesystem');
      write('[ OK ] loading operator profile: ghost');
      write('[ OK ] initializing CRT compositor');
      write('[ OK ] audio synth armed');
      write('[WARN] signal integrity: 87% — visual artifacts expected','warn');
      write('');
      write('Welcome to the NIGHTFALL training node. Type `help` to begin.','info');
    } else {write('terminal reset. session state preserved.','dim')}
    screen.appendChild(input);prompt();
  }

  input.addEventListener('input',updateCursor);
  input.addEventListener('keyup',updateCursor);
  input.addEventListener('click',updateCursor);
  input.addEventListener('keydown',e=>{
    if(state.matrix){e.preventDefault();state.matrix.stop();return}
    if(state.editor)return;
    if(e.key==='c'&&e.ctrlKey){
      e.preventDefault();
      if(state.pendingJob){ clearPendingJob(); beep('kill'); soundLabel('JOB INTERRUPTED'); write('^C','warn'); write('operation interrupted.','err'); prompt(); return; }
      write('^C','warn'); beep('kill'); input.value=''; updateCursor(); return;
    }
    if(e.key==='Enter'){run(input.value);return}
    if(e.key==='ArrowUp'){e.preventDefault();if(!state.history.length)return;state.histIndex=Math.max(0,state.histIndex-1);input.value=state.history[state.histIndex]||'';requestAnimationFrame(updateCursor)}
    if(e.key==='ArrowDown'){e.preventDefault();state.histIndex=Math.min(state.history.length,state.histIndex+1);input.value=state.history[state.histIndex]||'';requestAnimationFrame(updateCursor)}
    if(e.key==='Tab'){e.preventDefault();const v=input.value;const parts=v.split(/\s+/);const token=parts[parts.length-1];if(parts.length===1){const opts=commands.filter(c=>c.startsWith(token));if(opts.length===1){input.value=opts[0]+' ';requestAnimationFrame(updateCursor)}else if(opts.length>1){write(opts.join('  '),'dim');beep('key')}}else{const opts=filesForCompletion().filter(c=>c.startsWith(token));if(opts.length===1){parts[parts.length-1]=opts[0];input.value=parts.join(' ');requestAnimationFrame(updateCursor)}}}
    if(e.key==='l'&&e.ctrlKey){e.preventDefault();screen.innerHTML='';prompt()}
    if(e.key==='k'&&e.ctrlKey){e.preventDefault();triggerGlitch(1400)}
    if(e.key.length===1 && !e.ctrlKey && !e.metaKey){beep('type');soundLabel('KEY CLICK')}
  });
  document.addEventListener('click',()=>input.focus());
  function mildSignalDistortion(){
    if(document.hidden)return;
    shell.classList.remove('signal-distort','retro-hit');
    void shell.offsetWidth;
    shell.classList.add('signal-distort','retro-hit');
    if(signalTear){signalTear.style.setProperty('--tear-top',(20+Math.random()*62).toFixed(1)+'%');signalTear.classList.remove('active');void signalTear.offsetWidth;signalTear.classList.add('active');}
    setTimeout(()=>{shell.classList.remove('signal-distort','retro-hit');signalTear?.classList.remove('active')},380);
    setTimeout(mildSignalDistortion,2600+Math.random()*4200);
  }
  setTimeout(mildSignalDistortion,1800+Math.random()*1800);

  updateTree();boot();
})();
</script>
<canvas id="staticCanvas" aria-hidden="true"></canvas>
<style>
#staticCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:79;pointer-events:none;opacity:.018;mix-blend-mode:screen;image-rendering:pixelated;transition:opacity .08s steps(2,end);}
#staticCanvas.static-burst{opacity:.32;animation:tvStaticBurst .48s steps(4,end) both;}
@keyframes tvStaticBurst{0%{opacity:.03;filter:contrast(1)}12%{opacity:.38;filter:contrast(1.8)}35%{opacity:.25;filter:contrast(1.35)}55%{opacity:.44;filter:contrast(2.2)}78%{opacity:.18;filter:contrast(1.2)}100%{opacity:.03;filter:contrast(1)}}
</style>
<script>
(()=>{
  const c=document.getElementById('staticCanvas'),x=c.getContext('2d',{alpha:true});
  let w=0,h=0,burstTimer;
  function size(){w=c.width=Math.max(320,Math.floor(innerWidth/2));h=c.height=Math.max(180,Math.floor(innerHeight/2));}
  function noise(){
    if(!w||!h)return;
    const im=x.createImageData(w,h),d=im.data;
    const burst=c.classList.contains('static-burst');
    for(let i=0;i<d.length;i+=4){
      const v=Math.random()*255|0;
      const grain=burst ? (Math.random()*90|0) : (Math.random()*18|0);
      d[i]=Math.min(170,v*.60+grain*.12);
      d[i+1]=Math.min(255,v+grain);
      d[i+2]=Math.min(170,v*.60+grain*.10);
      d[i+3]=burst ? ((Math.random()*95)|0) : ((Math.random()*8)|0);
    }
    x.putImageData(im,0,0);
    // occasional horizontal interference bands, like an old TV losing signal
    if(burst){
      const bands=2+Math.random()*4|0;
      for(let i=0;i<bands;i++){
        const y=Math.random()*h|0, bh=1+Math.random()*7|0;
        x.fillStyle=`rgba(190,255,195,${(.05+Math.random()*.16).toFixed(2)})`;
        x.fillRect(0,y,w,bh);
        if(Math.random()<.65){
          x.fillStyle='rgba(0,0,0,.12)';
          x.fillRect((Math.random()*w*.35)|0,y,w*.65,bh+1);
        }
      }
    }
    requestAnimationFrame(noise);
  }
  function staticBurst(){
    c.classList.remove('static-burst');
    void c.offsetWidth;
    c.classList.add('static-burst');
    clearTimeout(burstTimer);
    burstTimer=setTimeout(()=>c.classList.remove('static-burst'),520+Math.random()*260);
    // keep bursts frequent but unpredictable: roughly every 4–7 seconds
    setTimeout(staticBurst,3900+Math.random()*3200);
  }
  addEventListener('resize',size,{passive:true});
  size();
  noise();
  setTimeout(staticBurst,2200);
})();
</script>
